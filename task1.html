<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up page</title>
  </head>
  <body>
    <h1>Login Form using HTML</h1>
    <p>Sign in with your credentials to access your secure student portal.</p>
    <hr />
    <p>Identity & Security</p>
    <form>
      <label>Select Portal Type: </label>
      <select>
        <option>--Choose Account Type--</option>
        <option>Academic Staff</option>
        <option>Learners</option></select
      ><br />
      <br />
      <label>Campus Location:</label><br />
      <input type="Location" /><br /><br />
      <label>Your Username: </label>
      <input type="Text" /><br /><br>
      <label>Your Password:</label><br />
      <input type="password" /><br /><br />
    </form>
    <p>Security Verification</p>
    <form>
      <label>Verification Date: </label>
      <input type="Date" /><br /><br>
      <label>4-Digit Security PIN: </label>
      <input type="Number" /><br />
      <br />
    </form>
    <p>Prefrences</p>
      <input type="Checkbox"> Remember me on this device</input><br>
      <input type="Checkbox"> I accept the secure login policy</input><br><br>
      <button type="reset">Clear Form</button>
      <button type="submit">Secure Login</button>
    </form>
  </body>
</html>
